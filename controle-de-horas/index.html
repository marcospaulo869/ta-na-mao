<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2530;--mut:#5d6b7a;--line:#dde3ea;--pri:#0b6e4f;--pri2:#e3f4ed;--onpri:#fff;--warn:#b45309;--warnbg:#fef3c7;--err:#b91c1c;--errbg:#fee2e2;--ext:#1d4ed8;--hol:#7c3aed;--holbg:#f3e8ff}
@media (prefers-color-scheme:dark){:root{--bg:#111820;--card:#1a232e;--ink:#e8edf2;--mut:#93a1b0;--line:#2c3947;--pri:#34d399;--pri2:#12332a;--onpri:#06281d;--warn:#fbbf24;--warnbg:#3a2e0b;--err:#f87171;--errbg:#3b1717;--ext:#7aa2ff;--hol:#c4a5ff;--holbg:#2a1d45;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--pri);color:var(--onpri);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:19px}
header small{opacity:.85;display:block}
header .hx{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
header .hx button{background:transparent;color:var(--onpri);border:1px solid currentColor;border-radius:7px;padding:5px 10px;font:inherit;cursor:pointer}
nav{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mut);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{padding:12px;max-width:1200px;margin:auto}
body.hasfoot main{padding-bottom:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%}
input[type=checkbox]{width:auto;margin:0}
input:disabled{opacity:.45}
button.b{width:auto;cursor:pointer;font-weight:600}
button.p{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
button.d{color:var(--err)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.row>div{flex:1;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:600}
.chips label.on{background:var(--pri2);border-color:var(--pri)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;margin-top:6px;cursor:pointer}
.link{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.link input{flex:1;min-width:200px;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sum span{display:block;font-size:12px;color:var(--mut)}
.sum b{font-size:18px}
.sum .hi{background:var(--pri2);border-color:var(--pri)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mut);background:var(--bg)}
td.l,th.l{text-align:left}
td input,td select{padding:5px;min-width:92px}
td.sel{min-width:130px}
button.clr{font-size:11.5px;padding:2px 8px;min-height:0;margin:3px 0 0 8px;font-weight:600;color:var(--mut)}
td small.st{display:block;font-size:11.5px;font-weight:600;color:var(--mut)}
tr.off td{background:var(--bg);color:var(--mut)}
tr.hol small.st{color:var(--hol)}
tr.falta small.st{color:var(--err)}
tr.wkrow td{background:var(--pri2);text-align:left;padding:8px 12px;border-bottom:2px solid var(--pri);white-space:normal}
tr.wkrow .wkl{display:flex;flex-wrap:wrap;gap:2px 20px;align-items:baseline}
tr.wkrow .wkx{color:var(--ext);font-weight:600}
tr.wkrow .wkx b{font-size:15px}
tr.wkrow .mut{color:var(--mut);font-size:12px;font-weight:400}
small.vl,.vl{color:var(--err)}
td small.vl{display:block;font-size:12px;font-weight:600}
tr.wkrow .wk2 b.vl{color:var(--err)}
tr.wkrow .wk2{font-size:15px;margin-top:2px}
tr.wkrow .wk2 b{color:var(--pri);font-size:17px}
tr.today td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
.ext{color:var(--ext);font-weight:700}
.al{font-size:12px;color:var(--warn);white-space:normal;text-align:left;min-width:150px}
.note{font-size:12.5px;color:var(--mut);margin:8px 0}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.info{background:var(--pri2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
table.r{min-width:0}
table.r td{text-align:left;white-space:normal}
table.r td:last-child,table.r th:last-child{text-align:right;white-space:nowrap}
table.r tr.t td{font-weight:700;background:var(--pri2)}
.hide{display:none!important}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--pri);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#foot .wk{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
#foot .wk div{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.3}
#foot .wk div b{display:block;font-size:13px}
#foot .wk div[data-wk]{cursor:pointer;transition:background .15s,border-color .15s}
#foot .wk div[data-wk]:hover,#foot .wk div[data-wk]:focus-visible{border-color:var(--pri);background:var(--pri2);outline:none}
@keyframes pisca{0%{box-shadow:inset 0 0 0 2px var(--pri)}100%{box-shadow:inset 0 0 0 2px transparent}}
tr.pisca{animation:pisca 1.4s ease-out}
#foot .mo{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--mut)}
#foot .mo b{font-size:16px;color:var(--ink)}
#foot .mo .tot b{color:var(--pri);font-size:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.auth{max-width:380px;margin:40px auto}
.auth .card{display:grid;gap:10px}
.emp-today .times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emp-today .times div{display:flex;flex-direction:column;gap:4px}
.emp-today .times .in{display:flex;gap:6px}
.emp-today .times .in button{flex:0 0 auto}
.emp-day{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.emp-day:last-child{border-bottom:0}
.emp-day .r{text-align:right;white-space:nowrap}
.emp-day small{display:block;color:var(--mut)}
.mnav{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}
.mnav b{font-size:16px}
@media(max-width:720px){
 body{font-size:16px}
 input,select,button.b{font-size:16px;min-height:44px}
 main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;padding:0 0 env(safe-area-inset-bottom);justify-content:space-around;background:var(--card);border-top:1px solid var(--line);border-bottom:0;z-index:7}
 nav button{flex:1;padding:12px 1px;font-size:11.5px;border-bottom:0;border-top:3px solid transparent}
 nav button.on{border-top-color:var(--pri)}
 #foot{bottom:var(--navh,56px);padding:6px 12px}
 #foot .dk{display:none}
 #foot .wk div{padding:3px 7px;font-size:11.5px}
 #foot .mo .tot b{font-size:17px}
 body.hasfoot main{padding-bottom:calc(var(--navh,56px) + 150px)}
 .tw{border:0;background:none;overflow:visible}
 table{min-width:0;display:block}
 thead{display:none}
 tbody{display:block}
 tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
 tbody td{display:block;border:0;padding:0;text-align:left;white-space:normal}
 tr.off td{background:none}
 td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);font-weight:600}
 td.l,td.sel,td.al{grid-column:1/-1}
 td.l{font-weight:700}
 button.clr{min-height:32px;font-size:13px;margin:0 0 0 8px}
 tbody tr.wkrow{display:block;padding:0;border:0;background:none;margin-bottom:10px}
 tbody tr.wkrow td{display:block;border:1px solid var(--pri);border-radius:10px;padding:10px 12px}
 td.al:empty,td.sel:empty{display:none}
 td input,td select{width:100%;min-width:0}
 table.dsem,table.r{display:table;width:100%}
 .dsem tbody,table.r tbody{display:table-row-group}
 .dsem tbody tr,table.r tbody tr{display:table-row;background:none;border:0;padding:0;margin:0}
 .dsem tbody td,table.r tbody td{display:table-cell;padding:5px 6px;border-bottom:1px solid var(--line)}
 .dsem tbody td:nth-child(n+3),table.r tbody td:last-child{text-align:right}
}
@media print{header,nav,#foot,.noprint{display:none!important}body{background:#fff;color:#000}main{max-width:none}td input,td select{border:0;background:none;padding:0;appearance:none}}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pgh{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.pgh:last-child{border-bottom:0}.pgh small{color:var(--mut);display:block}
.pgh .v{font-weight:700;text-align:right}.pgh .ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pgh .ac button{padding:4px 10px;min-height:0}
.rbadge{display:block;font-size:12.5px;font-weight:600;margin-top:3px;color:var(--mut)}
.rbadge.ok{color:var(--pri)}.rbadge.no{color:var(--err)}.rbadge.wait{color:var(--warn)}
.dsem{width:100%;min-width:0;font-size:13.5px}.dsem td{padding:4px 6px;text-align:left}.dsem td:nth-child(n+3){text-align:right}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid var(--line)}
.avatar.ph{display:grid;place-items:center;background:var(--pri2);color:var(--pri);font-weight:700;font-size:30px}
.perfil-foto{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.perfil-foto .b{margin:2px 6px 2px 0}
.priv{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:16px max(16px,env(safe-area-inset-left)) 40px}
.privtxt{max-width:780px;margin:0 auto;font-size:15px;line-height:1.55}
.privtxt h2{margin:8px 0 4px}.privtxt h3{margin:18px 0 4px;font-size:16px}.privtxt ul{padding-left:20px;margin:6px 0}
.privbar{max-width:780px;margin:0 auto 10px;display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0}
@media print{.privbar{display:none}.priv{position:static;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header id="hdr"><div><h1>Controle de Horas</h1><small id="sub">Carteira assinada (CLT) e diaristas</small></div><div class="hx" id="hx"></div></header>
<nav id="tabs">
<button data-t="emp" class="on">Equipe</button>
<button data-t="folha">Folha</button>
<button data-t="pag">Pagar</button>
<button data-t="pon">Ponto</button>
<button data-t="resc">Rescisão</button>
<button data-t="cfg">Ajustes</button>
</nav>
<main id="main">
<div id="banner"></div>
<section id="t-emp"></section>
<section id="t-folha" class="hide"></section>
<section id="t-pag" class="hide"></section>
<section id="t-pon" class="hide"></section>
<section id="t-resc" class="hide"></section>
<section id="t-cfg" class="hide"></section>
</main>
<div id="foot" class="hide"></div>
<div id="toast" class="hide"></div>
<script>
/* ===== utilitários ===== */
const $=s=>document.querySelector(s);
const ajudaDia=()=>Math.max(0,+((S.cfg.empresa||{}).ajudaDia)||0);
const ajudaOk=ds=>{const d=(S.cfg.empresa||{}).ajudaDesde;return !d||ds>=d};
const brl=n=>(isFinite(n)?n:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const hm=min=>{min=Math.round(min||0);const s=min<0?'-':'';min=Math.abs(min);return s+Math.floor(min/60)+':'+String(min%60).padStart(2,'0')};
const tmin=v=>{if(!v||!/^\d{1,2}:\d{2}/.test(v))return null;const [h,m]=v.split(':').map(Number);return h*60+m};
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return {y,m,d}};
const toD=o=>new Date(Date.UTC(o.y,o.m-1,o.d));
const fromD=dt=>({y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()});
const addDays=(o,n)=>{const dt=toD(o);dt.setUTCDate(dt.getUTCDate()+n);return fromD(dt)};
const addMonths=(o,n)=>{const t=o.y*12+(o.m-1)+n,y=Math.floor(t/12),m=t%12+1;return {y,m,d:Math.min(o.d,dim(y,m))}};
const cmp=(a,b)=>toD(a)-toD(b);
const todayS=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const nowHM=()=>{const t=new Date();return pad(t.getHours())+':'+pad(t.getMinutes())};
const ymAdd=(ym,n)=>{const [y,m]=ym.split('-').map(Number),o=addMonths({y,m,d:1},n);return o.y+'-'+pad(o.m)};
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][m-1]+' de '+y};
const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],ORD=[1,2,3,4,5,6,0];
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});
const dig=v=>String(v||'').replace(/\D/g,'');
const MASK={cpf:v=>{v=dig(v).slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')},
 tel:v=>{v=dig(v).slice(0,11);return v.length>10?v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3'):v.length>6?v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3'):v.length>2?v.replace(/(\d{2})(\d*)/,'($1) $2'):v},
 cep:v=>{v=dig(v).slice(0,8);return v.length>5?v.slice(0,5)+'-'+v.slice(5):v},
 cnpj:v=>{v=dig(v).slice(0,14);return v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2')}};
function cpfValido(v){v=dig(v);if(v.length!==11||/^(\d)\1+$/.test(v))return false;
 for(const n of [9,10]){let t=0;for(let i=0;i<n;i++)t+=+v[i]*(n+1-i);if((t*10)%11%10!==+v[n])return false}return true}
function compressSquare(file,size=256){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const m=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=size;
  c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(u);
  let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>90000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};
 img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Imagem inválida'))};img.src=u})}
const avatarHtml=e=>e.foto?`<img class="avatar" alt="Foto de ${esc(e.nome)}" src="${esc(e.foto)}">`:`<div class="avatar ph" aria-hidden="true">${esc((e.nome||'?').trim().charAt(0).toUpperCase())}</div>`;
async function buscaCep(cep){const c=dig(cep);if(c.length!==8)return null;
 try{const r=await fetch('https://viacep.com.br/ws/'+c+'/json/');const j=await r.json();if(j.erro)return null;return {rua:j.logradouro||'',bairro:j.bairro||'',cidade:j.localidade||'',uf:j.uf||''}}catch(x){return null}}
const fmtAceite=a=>a?a.slice(8,10)+'/'+a.slice(5,7)+'/'+a.slice(0,4)+' '+a.slice(11,16):'';
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hide'),2600)}
async function copy(txt,inp){try{await navigator.clipboard.writeText(txt);toast('Link copiado')}catch(e){if(inp){inp.select();toast('Selecionado: copie com Ctrl+C')}}}

/* ===== aviso de privacidade (LGPD) ===== */
const POL_VERSAO='2026-10c';
const APP_VERSAO='30/10/2026 · 2';
function politicaHtml(em){em=em||{};const f=(v,ph)=>v?esc(v):`<i>[${ph}]</i>`;
 return `<div class="privtxt"><h2>Aviso de privacidade</h2><p><small>Versão ${POL_VERSAO}</small></p>
 <p>Este aviso explica, em linguagem simples, quais dados pessoais o sistema <b>Controle de Horas</b> usa, para quê, quem pode ver e quais são os seus direitos, conforme a Lei Geral de Proteção de Dados (Lei 13.709/2018, a LGPD).</p>
 <h3>1. Quem é responsável pelos seus dados</h3>
 <p>A empresa para a qual você trabalha: <b>${f(em.nome,'nome da empresa')}</b>${em.cnpj?', CNPJ '+esc(em.cnpj):''}. Ela decide por que e como os seus dados são usados. O sistema Controle de Horas é só a ferramenta que a empresa usa para fazer isso.</p>
 <p>Contato para assuntos de privacidade: ${f(em.encarregado,'responsável')} · ${f(em.email,'e-mail')}${em.telefone?' · '+esc(em.telefone):''}</p>
 <h3>2. Quais dados são usados</h3><ul>
 <li><b>Identificação:</b> nome, função, foto (selfie), CPF, RG, data de nascimento, estado civil.</li>
 <li><b>Contato e endereço:</b> telefone, e-mail, contato de emergência, endereço.</li>
 <li><b>Trabalho:</b> data de início, regime (carteira assinada ou diarista), valor da hora ou salário, PIS e carteira de trabalho (quando houver), dias de trabalho.</li>
 <li><b>Ponto:</b> data e hora de cada registro, o IP da internet usada e a localização aproximada (GPS), <b>somente no momento em que você toca em "Registrar"</b>.</li>
 <li><b>Pagamento:</b> valores, vales, chave Pix, banco e comprovantes, e a <b>sua confirmação de recebimento</b> (data, hora, rede de internet e tipo de aparelho no momento em que você confirma).</li>
 <li><b>Documentos:</b> arquivos que a empresa anexar ao seu cadastro (por exemplo, RG, comprovante de residência, atestados).</li></ul>
 <h3>3. Para que usamos e em que base legal</h3><ul>
 <li><b>Calcular e pagar o trabalho</b> (horas, extras, faltas, vales, rescisão): execução do contrato e cumprimento de obrigação legal trabalhista e fiscal.</li>
 <li><b>Controlar a jornada e confirmar o local do registro</b> (IP e GPS): cumprimento de obrigação legal e legítimo interesse da empresa em ter um controle de ponto confiável, evitando erros e fraudes. A localização <b>não é usada para acompanhar você fora do momento do registro</b>.</li>
 <li><b>Identificar você no cadastro</b> (foto e documentos): execução do contrato e obrigação legal. A foto <b>não é usada para reconhecimento facial</b>.</li>
 <li><b>Contato e segurança:</b> falar com você e com a pessoa indicada em caso de emergência.</li></ul>
 <h3>4. Quem pode ver os seus dados</h3><ul>
 <li>A empresa (a pessoa administradora do sistema) vê o seu cadastro completo.</li>
 <li><b>Você</b> vê, no seu celular, o seu perfil, os seus registros de ponto e o resumo do mês. O CPF aparece parcialmente escondido. Você não vê dados de outros colaboradores.</li>

 <li><b>Serviços de tecnologia usados pelo sistema:</b> o banco de dados e os arquivos ficam no Supabase, em servidor no Brasil (São Paulo), e o site é entregue pela Cloudflare. Eles apenas guardam os dados, sem usar para outros fins. Ao digitar o CEP, o sistema consulta o serviço público ViaCEP, que recebe somente o CEP.</li>
 <li>Os dados <b>não são vendidos</b> nem usados para publicidade.</li></ul>
 <h3>5. Por quanto tempo guardamos</h3>
 <p>Pelo tempo que durar o seu trabalho e depois dele, pelo prazo que a legislação trabalhista, previdenciária e fiscal exigir para guardar registros de jornada, pagamentos e documentos (em regra, cerca de cinco anos após o fim do contrato; alguns documentos, por mais tempo). Depois disso, os dados são excluídos ou anonimizados.</p>
 <h3>6. Como protegemos</h3><ul>
 <li>Conexão protegida (HTTPS) e acesso do administrador por e-mail e senha.</li>
 <li>Seu acesso é por um link pessoal. <b>Não compartilhe o seu link</b>; se alguém tiver acesso a ele, peça um novo ao responsável.</li>
 <li>Cada registro de ponto é gravado pelo servidor e não pode ser editado por você. Correções feitas pelo administrador ficam marcadas.</li>
 <li>Fotos, documentos e comprovantes ficam em pastas privadas. Nenhum sistema é totalmente imune a falhas, e em caso de incidente que possa causar risco a você, a empresa informará.</li></ul>
 <h3>7. Os seus direitos</h3>
 <p>Você pode pedir à empresa, a qualquer momento: confirmar se usa os seus dados; acessar os dados; corrigir dados incompletos ou errados (o telefone, o endereço, os contatos e a foto você mesmo atualiza no seu perfil); pedir anonimização, bloqueio ou eliminação de dados desnecessários; receber uma cópia; saber com quem os dados foram compartilhados; e reclamar à Autoridade Nacional de Proteção de Dados (ANPD). Alguns dados precisam ser mantidos por obrigação legal, e a empresa explicará quando for o caso.</p>

  let m1=0,m2=0;
  if(a!=null&&b!=null){if(b>a)m1=b-a;else x.al.push('Saída da manhã antes da entrada')}
  else if(a!=null||b!=null)x.al.push('Manhã incompleta');
  if(c!=null&&dd!=null){if(dd>c)m2=dd-c;else x.al.push('Saída da tarde antes da entrada')}
  else if(c!=null||dd!=null)x.al.push('Tarde incompleta');
  let w=m1+m2;
  if(['falta','folga','just','nt'].includes(t))w=0;
  x.w=w;
  const meta=x.sched&&wd!==0?(wd===6?+e.metaSab:+e.metaSem)*60:0;
  if(w>0){
   if(b!=null&&c!=null&&c>=b){const alm=c-b;
    if(w>360&&alm<60)x.al.push('Intervalo menor que 1h (CLT art. 71)');
    else if(w>240&&w<=360&&alm<15)x.al.push('Intervalo menor que 15min (CLT art. 71)')}
   else if(w>360&&(m1===0||m2===0))x.al.push('Mais de 6h sem intervalo (CLT art. 71)');
   if(clt&&w>meta+120&&meta>0)x.al.push('Mais de 2h extras no dia (CLT art. 59)');
   if(clt&&w>600)x.al.push('Jornada acima de 10h');
   const first=a!=null&&m1?a:c;
   if(clt&&prev&&prev.d===d-1&&first!=null&&(1440-prev.out+first)<660)x.al.push('Menos de 11h de descanso desde o dia anterior (CLT art. 66)');
   prev={d,out:m2?dd:b};
   if(!x.sched)x.al.push('Dia fora da escala');
  }
  let falta=false;
  if(t==='falta'){x.st='Falta injustificada';falta=clt}
  else if(t==='just'){x.st='Falta justificada / atestado'}
  else if(t==='folga'){x.st='Folga'}
  else if(t==='nt'){x.st='Não trabalhou'}
  else if(w>0){
   if(clt&&(hol||wd===0)){
    x.fer=w;T.fer+=w;x.vlr=(w/60)*hora*(1+e.adicFer/100);x.vf=x.vlr;W.vf+=x.vlr;T.vFer+=(w/60)*hora*e.adicFer/100;T.valHoras+=x.vlr;
    x.st=hol?'Feriado trabalhado: '+hol:'Domingo trabalhado';
   }else{
    let nm,ex;
    if(clt){const capLeft=Math.max(0,e.capSemana*60-W.norm);nm=Math.min(w,meta,capLeft);ex=w-nm;W.norm+=nm}
    else{nm=e.pagaExtra?Math.min(w,e.jornada*60):w;ex=w-nm;if(!e.pagaExtra&&w>e.jornada*60){x.acima=w-e.jornada*60;T.acima+=x.acima}}
    x.norm=nm;x.ext=ex;T.norm+=nm;T.ext+=ex;W.ext+=ex;
    const vn=(nm/60)*hora,ve=(ex/60)*hora*(1+e.adicExtra/100);
    x.vlr=vn+ve;x.vn=vn;x.ve=ve;W.vn+=vn;W.ve+=ve;T.valHoras+=x.vlr;T.vNorm+=vn;T.vExt+=ve;
    if(clt&&x.sched&&w<meta){x.atr=meta-w;x.desc=(meta-w)/60*hora;T.dAtr+=x.desc;x.al.push('Atraso / saída antecipada: '+hm(meta-w))}
    if(hol)x.st='Feriado: '+hol;
   }
  }else{
   if(hol)x.st='Feriado: '+hol;
   else if(!x.sched||wd===0)x.st=wd===0?'Descanso semanal':'Fora da escala';
   else if(clt&&adm&&ds<today&&e.autoFalta!==false){x.st='Falta (sem registro)';x.auto=true;falta=true}
  }
  if(falta){x.falta=true;x.desc=sal/30;T.dFalta+=sal/30;T.nFaltas++;W.falta=true}
  if(w>0){T.total+=w;T.diasTrab++;W.dias++;W.min+=w;W.val+=x.vlr||0}
  days.push(x);
 }
 const wl=Object.values(weeks);
 if(clt){
  wl.forEach(w=>{if(w.falta){T.dDsr+=sal/30;T.nDsr++}});
  const ad=pd(adm);
  if(ad&&ad.y===Y&&ad.m===M)T.dAdm=sal/30*Math.min(30,ad.d-1);
  T.pagar=(adm&&adm>ym+'-'+pad(n))?0:Math.max(0,sal-T.dAtr-T.dFalta-T.dDsr-T.dAdm+T.vExt+T.vFer);
 }else{
  T.pagar=T.valHoras;
  wl.forEach(w=>{if(w.dias>=3)alerts.push('Semana de '+pad(w.ini)+' a '+pad(w.fim)+': '+w.dias+' dias trabalhados. Três ou mais dias por semana para o mesmo contratante podem caracterizar vínculo (doméstico: LC 150/2015; demais: CLT art. 3º).')});
 }
 T.vales=(e.vales||[]).filter(v=>v.d&&v.d.startsWith(ym)).reduce((a,v)=>a+(+v.v||0),0);
 const AJ=ajudaDia();
 days.forEach(x=>{x.ajuda=x.w>0&&ajudaOk(x.ds)?AJ:0});T.ajuda=days.reduce((a,x)=>a+x.ajuda,0);
 T.liquido=T.pagar-T.vales+T.ajuda;
 /* vales por dia e por semana (só a parte da semana que cai neste mês, igual às linhas mostradas) */
 const vm=(e.vales||[]).filter(v=>v.d&&v.d.startsWith(ym)&&+v.v);
 days.forEach(x=>{x.vale=vm.filter(v=>v.d===x.ds).reduce((a,v)=>a+(+v.v||0),0)});
 wl.forEach(w=>{w.ajuda=days.filter(x=>x.d>=w.ini&&x.d<=w.fim).reduce((a,x)=>a+x.ajuda,0)});
 wl.forEach(w=>{w.vale=vm.filter(v=>{const n=+v.d.slice(8);return n>=w.ini&&n<=w.fim}).reduce((a,v)=>a+(+v.v||0),0)});
 return {days,T,hora,alerts,weeks:wl};
}

/* ===== rescisão (CLT) ===== */
function mesesComp(ini,fimIncl){ // meses com 15 dias ou mais, de ini a fimIncl
 let c=0,cur={y:ini.y,m:ini.m,d:1};
 while(cur.y*12+cur.m<=fimIncl.y*12+fimIncl.m){
  const s=cmp(cur,ini)<0?ini:cur,l={y:cur.y,m:cur.m,d:dim(cur.y,cur.m)},f=cmp(l,fimIncl)>0?fimIncl:l;
  if(f.d-s.d+1>=15)c++;cur=addMonths(cur,1)}
 return c}
function anosCompletos(adm,fim){let y=0;while(cmp(addMonths(adm,12*(y+1)),fim)<=0)y++;return y}
function calcRescisao(e){
 const adm=pd(e.adm),dl=pd(e.deslig||todayS());if(!adm||!dl||cmp(dl,adm)<0)return null;
 const m=e.motivo,sal=+e.salario||0,rem=sal+(+e.mediaExtras||0),R={};
 const anos=anosCompletos(adm,dl);
 let meses=0;while(cmp(addMonths(adm,meses+1),dl)<=0)meses++;
 R.tempo={anos:Math.floor(meses/12),meses:meses%12,dias:Math.round((toD(dl)-toD(addMonths(adm,meses)))/864e5)};
 const dg=(m==='sem_justa'||m==='acordo'),acordo=m==='acordo',justa=m==='justa';
 const avisoDias=dg?Math.min(90,30+3*anos):0,fimProj=dg?addDays(dl,avisoDias):dl;
 R.avisoDias=avisoDias;
 const ini=(adm.y===dl.y&&adm.m===dl.m)?adm.d:1,dias=Math.min(30,dl.d-ini+1);
 R.saldoDias=dias;R.saldo=sal/30*dias;
 R.aviso=dg?rem/30*avisoDias*(acordo?.5:1):0;
 const iniAno=adm.y===fimProj.y?adm:{y:fimProj.y,m:1,d:1};
 R.m13=justa?0:mesesComp(iniAno,fimProj);R.v13=rem/12*R.m13;
 const anosP=anosCompletos(adm,fimProj);
 R.venc=Math.max(0,anosP-(+e.feriasGozadas||0));R.vVenc=R.venc*rem;R.vVenc3=R.vVenc/3;
 R.mFer=justa?0:Math.min(12,mesesComp(addMonths(adm,12*anosP),fimProj));R.vFer=rem/12*R.mFer;R.vFer3=R.vFer/3;
 R.verbas=R.saldo+R.aviso+R.v13+R.vVenc+R.vVenc3+R.vFer+R.vFer3;
 let totMeses=0;{let cur={y:adm.y,m:adm.m,d:1};while(cur.y*12+cur.m<=dl.y*12+dl.m){totMeses++;cur=addMonths(cur,1)}}
 R.fgtsEst=e.fgtsSaldo===''||e.fgtsSaldo==null;
 R.fgtsSaldo=R.fgtsEst?Math.max(0,0.08*rem*Math.max(0,totMeses-1)):+e.fgtsSaldo;
 R.fgtsVerbas=justa?0:0.08*(R.saldo+R.aviso+R.v13);
 R.pctMulta=m==='sem_justa'?.4:acordo?.2:0;R.multa=(R.fgtsSaldo+R.fgtsVerbas)*R.pctMulta;
 R.custo=R.verbas+R.fgtsVerbas+R.multa;
 return R}

function parseLista(txt,defY){const rows=[],bad=[],z={a:'',b:'',c:'',d:''};
 txt.split(/\n/).forEach(raw=>{const l=raw.trim();if(!l)return;
  const m=l.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*(.*)$/);if(!m){bad.push(l);return}
  let y=m[3]?+m[3]:defY;if(y<100)y+=2000;const mo=+m[2],d=+m[1];
  if(mo<1||mo>12||d<1||d>dim(y,mo)){bad.push(l);return}
  const rest=m[4].trim(),ds=y+'-'+pad(mo)+'-'+pad(d);let r;
  if(/atestado|justific/i.test(rest))r={...z,t:'just'};
  else if(/falta/i.test(rest))r={...z,t:'falta'};
  else if(/folga/i.test(rest))r={...z,t:'folga'};
  else{const tk=rest.split(/[\s;,]+/).filter(Boolean);if(!tk.length||tk.length>4){bad.push(l);return}
   const v=tk.map(x=>x==='-'?'':x);if(v.some(x=>x&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(x))){bad.push(l);return}
   const f=x=>x?pad(+x.split(':')[0])+':'+x.split(':')[1]:'';r={a:f(v[0]),b:f(v[1]),c:f(v[2]),d:f(v[3]),t:''}}
  rows.push({ds,r})});return {rows,bad}}

 return {n:rows.length,meses:[...meses].sort(),bad}}

const mondayOf=ds=>{const [y,m,d]=ds.split('-').map(Number),wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();return new Date(Date.UTC(y,m-1,d-((wd+6)%7))).toISOString().slice(0,10)};
const addD=(ds,n)=>{const [y,m,d]=ds.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const fmtBR=ds=>ds.slice(8)+'/'+ds.slice(5,7);
function semanaAlvo(now=new Date()){const mon=mondayOf(todayS()),wd=now.getDay();return wd===5||wd===6||wd===0?mon:addD(mon,-7)}
function calcSemana(e,mon){const fim=addD(mon,6),cm={},days=[];
 new Set([mon.slice(0,7),fim.slice(0,7)]).forEach(ym=>cm[ym]=calcMonth(e,ym,null,todayS()));
 for(let i=0;i<7;i++){const ds=addD(mon,i),x=cm[ds.slice(0,7)].days.find(z=>z.ds===ds);if(x)days.push(x)}
 const W={mon,fim,days,dias:0,min:0,ext:0,fer:0,val:0,vn:0,ve:0,vf:0,faltas:0};
 days.forEach(x=>{if(x.w>0){W.dias++;W.min+=x.w}W.vn+=x.vn||0;W.ve+=x.ve||0;W.vf+=x.vf||0;W.ext+=x.ext||0;W.acima=(W.acima||0)+(x.acima||0);W.fer+=x.fer||0;W.val+=x.vlr||0;if(x.falta)W.faltas++});
 W.vales=(e.vales||[]).filter(v=>v.d>=mon&&v.d<=fim).reduce((a,v)=>a+(+v.v||0),0);
 W.pago=(e.pagamentos||[]).filter(p=>p.ref===mon).reduce((a,p)=>a+(+p.v||0),0);
 W.diasAjuda=ajudaDia()?days.filter(x=>x.w>0&&ajudaOk(x.ds)).length:0;W.ajuda=W.diasAjuda*ajudaDia();
 W.pagar=Math.max(0,W.val+W.ajuda-W.vales-W.pago);return W}
function resumoTexto(e,W){const L=[`*Resumo da semana: ${e.nome}*`,`${fmtBR(W.mon)} a ${fmtBR(W.fim)}`,''];
 W.days.forEach(x=>{const dd=DN[x.wd]+' '+fmtBR(x.ds);
  if(x.w>0)L.push(`${dd}: ${hm(x.w)}${x.ext?' ('+hm(x.ext)+' extra)':''}${x.fer?' (feriado/domingo)':''} - ${brl(x.vlr)}`);
  else if(x.falta||x.st==='Falta injustificada'||x.st==='Folga'||x.st==='Falta justificada / atestado'||x.hol)L.push(`${dd}: ${x.falta?'falta':x.hol?'feriado':x.st.toLowerCase()}`)});
 L.push('',`Total: ${hm(W.min)} em ${W.dias} dia(s)${W.ext?', '+hm(W.ext)+' de extras':''}`,`Valor das horas: ${brl(W.val)}`);
 if(W.ajuda)L.push(`Ajuda de custo (celular): + ${brl(W.ajuda)} (${W.diasAjuda} dia(s) × ${brl(ajudaDia())})`);
 if(W.vales)L.push(`Vales: - ${brl(W.vales)}`);if(W.pago)L.push(`Já pago: - ${brl(W.pago)}`);
 L.push(`*A pagar: ${brl(W.pagar)}*`);return L.join('\n')}

const horaSP=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const dataBR=d=>d.slice(8,10)+'/'+d.slice(5,7);
function pegarGps(timeout=12000){return new Promise(res=>{if(!navigator.geolocation)return res(null);
 navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout,maximumAge:0})})}
function punchRow(p,acoes){return `<div class="pgh"><div><b>${dataBR(p.day)} ${horaSP(p.ts)}</b></div>
 <div>${esc(empNome(p.emp_id))} · ${CAMPO[p.field]||''}<small>${PLACE[p.place]||esc(p.place)}${p.dist_m!=null?' · a '+p.dist_m+' m'+(p.local_nome?' de '+esc(p.local_nome):''):''}${p.ip?' · IP '+esc(p.ip):''}${p.skew_sec&&Math.abs(p.skew_sec)>120?' · relógio do celular diferente ('+Math.round(p.skew_sec/60)+' min)':''}</small>${p.motivo?`<small>Motivo: ${esc(p.motivo)}</small>`:''}${p.lat!=null?`<small><a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">Ver no mapa</a></small>`:''}</div>
 <div class="v">${acoes?'':STAT[p.status]||p.status}</div>${acoes?`<div class="ac"><button class="b p" data-ap="${p.id}">Aprovar</button><button class="b d" data-rj="${p.id}">Recusar</button></div>`:''}</div>`}

 el.innerHTML=`<div class="card"><h2>Pendentes de aprovação</h2>${PEND.list.length?PEND.list.map(p=>punchRow(p,true)).join(''):'<p class="note">Nenhum registro pendente.</p>'}

  <div><label for="pr-m">Como verificar</label><select id="pr-m" data-k="metodo"><option value="ip">Só pelo IP da internet</option><option value="gps">Só pelo GPS</option><option value="any">IP ou GPS (um dos dois)</option><option value="both">IP e GPS (os dois)</option></select></div></div>

  <p class="note">Sem nenhum local cadastrado, o sistema não verifica. O IP é lido pelo servidor e o colaborador não consegue alterar. O GPS vem do celular e pode ser falsificado com aplicativos de localização falsa, por isso usar os dois juntos é mais seguro.</p></div>
 <div class="card noprint"><h2>Locais da empresa</h2>

   <p class="note" style="flex-basis:100%;margin:0">${l.lat!=null?'Localização: '+(+l.lat).toFixed(5)+', '+(+l.lon).toFixed(5):'Sem localização GPS cadastrada.'}</p></div>`).join('')||'<p class="note">Nenhum local cadastrado.</p>'}
  <button class="b p" id="addLoc">Cadastrar o local onde estou agora</button>
  <p class="note">Use esse botão estando na empresa, no celular ou no computador, com a internet da empresa. Ele guarda o GPS e o IP.</p>

 <div class="card"><h2>Últimos registros</h2>${PEND.recentes.length?PEND.recentes.map(p=>punchRow(p,false)).join(''):'<p class="note">Nenhum registro ainda.</p>'}</div>`;

 el.querySelectorAll('[data-lk]').forEach(i=>i.addEventListener('input',()=>{const l=pr.locais[+i.dataset.li],k=i.dataset.lk;
  l[k]=k==='raio'?(+i.value||100):k==='ips'?i.value.split(/[,\s]+/).filter(Boolean):i.value;persistCfg()}));
 el.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>{pr.locais.splice(+b.dataset.ldel,1);persistCfg();rPonto()});
 $('#addLoc').onclick=async()=>{const b=$('#addLoc');b.disabled=true;b.textContent='Obtendo a localização…';
  const g=await pegarGps(),{data:ip}=await sb.rpc('meu_ip');
  if(!g)toast('Sem GPS: permita o acesso ao local no navegador. Cadastrei só o IP.');
  pr.locais.push({id:uuid(),nome:'Unidade '+(pr.locais.length+1),lat:g?g.lat:null,lon:g?g.lon:null,raio:100,ips:ip?[ip]:[]});persistCfg();rPonto()};
 const ci=$('#clrIp');if(ci)ci.onclick=async()=>{await sb.rpc('ips_limpar');S.cfg.ip_recentes=[];rPonto()};
 el.querySelectorAll('[data-ap],[data-rj]').forEach(b=>b.onclick=async()=>{const ok=!!b.dataset.ap,id=b.dataset.ap||b.dataset.rj;b.disabled=true;
  const {error}=await sb.from('punches').update({status:ok?'approved':'rejected',decided_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Erro: '+error.message);b.disabled=false;return}
  await loadPend();Object.keys(LOADED).forEach(k=>delete LOADED[k]);toast(ok?'Aprovado':'Recusado');rPonto();rBanner()});
}
setInterval(()=>{if(CLOUD&&USER&&!document.hidden)loadPend().then(()=>{rBanner();if(CUR==='pon'&&!document.querySelector('#t-pon :focus'))rPonto()})},30000);

const ehUuid=x=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(x);
async function enviarParaNuvem(d){
 const map={},emps=(d.emps||[]).map(e0=>{const e={...e0};map[e0.id]=ehUuid(e0.id)?e0.id:uuid();e.id=map[e0.id];return fixEmp(e)});
 let q=await sb.from('employees').upsert(emps.map(e=>({id:e.id,data:empData(e)})));if(q.error)throw q.error;
 const ent=[];for(const e0 of d.emps||[]){const rec=(d.rec||{})[e0.id]||{};for(const ym in rec)for(const dia in rec[ym]){const x=rec[ym][dia];
  if(!(x.a||x.b||x.c||x.d||x.t))continue;ent.push({emp_id:map[e0.id],day:ym+'-'+pad(+dia),a:x.a||null,b:x.b||null,c:x.c||null,d:x.d||null,t:x.t||''})}}
 for(let i=0;i<ent.length;i+=200){const q2=await sb.from('entries').upsert(ent.slice(i,i+200),{onConflict:'emp_id,day'});if(q2.error)throw q2.error}
 if(d.cfg){const c=d.cfg;S.cfg.minimo=c.minimo||S.cfg.minimo;S.cfg.whats=c.whats||S.cfg.whats;if((c.feriados||[]).length)S.cfg.feriados=c.feriados;persistCfg()}
 await cloudLoad();Object.keys(LOADED).forEach(k=>delete LOADED[k]);
 return {emps:emps.length,dias:ent.length}}

const BIO_KEY='controle-horas-bio';
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
function bioGet(){try{const o=JSON.parse(localStorage.getItem(BIO_KEY)||'null');return o&&o.id&&o.uid?o:null}catch(e){return null}}
function bioDel(){try{localStorage.removeItem(BIO_KEY)}catch(e){}}
async function bioDisponivel(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioAtivar(){
 const ch=crypto.getRandomValues(new Uint8Array(32));
 const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'Controle de Horas'},
  user:{id:new TextEncoder().encode(USER.id).slice(0,64),name:USER.email,displayName:USER.email},
  pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
  authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
 try{localStorage.setItem(BIO_KEY,JSON.stringify({id:b64u(c.rawId),uid:USER.id}))}catch(e){throw new Error('Não consegui guardar no aparelho.')}}
async function bioPedir(o){
 await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
  allowCredentials:[{type:'public-key',id:unb64u(o.id),transports:['internal']}],userVerification:'required',timeout:60000}})}
function bioTela(o){return new Promise(ok=>{
 const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto';
 ov.innerHTML=`<div class="auth"><div class="card"><h2>App bloqueado</h2><p class="note">Use a digital (ou o desbloqueio do celular) para abrir.</p>
 <button class="b p" id="bio-go">Desbloquear com a digital</button><button class="b" id="bio-pw" style="border:0;background:none;color:var(--mut)">Entrar com e-mail e senha</button><div id="bio-m" class="note"></div></div></div>`;
 document.body.appendChild(ov);const q=i=>ov.querySelector(i);
 const tenta=async()=>{q('#bio-m').textContent='';try{await bioPedir(o);ov.remove();ok(true)}catch(e){q('#bio-m').textContent='Não foi possível confirmar a digital. Toque no botão para tentar de novo.'}};
 q('#bio-go').onclick=tenta;
 q('#bio-pw').onclick=async()=>{bioDel();await sb.auth.signOut();location.reload()};
 tenta()})}
function bioCard(){
 const box=$('#bioBox');if(!box||!CLOUD||!USER)return;
 bioDisponivel().then(av=>{const o=bioGet(),on=o&&o.uid===USER.id;
  if(!av&&!on){box.innerHTML='<p class="note">Este aparelho não tem digital ou bloqueio de tela disponível para o navegador.</p>';return}
  box.innerHTML=on?'<p class="info">Bloqueio por digital <b>ligado</b> neste aparelho.</p><button class="b d" id="bioOff">Desligar</button>':
   '<p class="note">Em vez de digitar e-mail e senha, o app pede a digital sempre que for aberto. Vale só para este aparelho.</p><button class="b p" id="bioOn">Ligar bloqueio por digital</button>';
  const m=document.createElement('div');m.className='note';box.appendChild(m);
  if(on)$('#bioOff').onclick=()=>{bioDel();bioCard();toast('Bloqueio por digital desligado')};
  else $('#bioOn').onclick=async()=>{try{await bioAtivar();bioCard();toast('Bloqueio por digital ligado')}catch(e){m.textContent='Não foi possível ligar: '+(e&&e.name==='NotAllowedError'?'a digital não foi confirmada.':(e.message||e))}}})}

const EMP={tok:null,ym:todayS().slice(0,7),e:null,today:todayS(),todayRec:{},recs:{}};
async function empFetch(){
 const [y,m]=EMP.ym.split('-').map(Number),from=EMP.ym+'-01',to=EMP.ym+'-'+pad(dim(y,m));
 if(CLOUD){const {data,error}=await sb.rpc('emp_get',{p_token:EMP.tok,p_from:from,p_to:to});
  if(error||!data)return false;
  EMP.e=fixEmp({...data.data,id:data.id});EMP.today=data.today;
  if(data.settings&&data.settings.feriados)S.cfg.feriados=data.settings.feriados;
  EMP.recs={};(data.entries||[]).forEach(r=>{EMP.recs[+r.day.slice(8)]={a:(r.a||'').slice(0,5),b:(r.b||'').slice(0,5),c:(r.c||'').slice(0,5),d:(r.d||'').slice(0,5),t:r.t||''}});
  const t=data.today_entry||{};EMP.todayRec={a:(t.a||'').slice(0,5),b:(t.b||'').slice(0,5),c:(t.c||'').slice(0,5),d:(t.d||'').slice(0,5)};
  EMP.recibos=data.recibos||[];EMP.punches=data.punches||[];EMP.proximo=data.proximo;EMP.ponto=data.ponto||{};EMP.empresa=(data.settings&&data.settings.empresa)||{};return true}
 const e=S.emps.find(x=>x.id===EMP.tok);if(!e)return false;
 EMP.e=e;EMP.empresa=S.cfg.empresa||{};EMP.today=todayS();EMP.recs=(S.rec[e.id]||{})[EMP.ym]||{};
 const tm=EMP.today.slice(0,7),td=+EMP.today.slice(8);EMP.todayRec=Object.assign({},((S.rec[e.id]||{})[tm]||{})[td]);return true}
async function empPunch(){
 const r=EMP.todayRec;
 if(CLOUD){const {data,error}=await sb.rpc('emp_punch',{p_token:EMP.tok,p_a:r.a||'',p_b:r.b||'',p_c:r.c||'',p_d:r.d||''});
  if(error||!data||!data.ok){toast((data&&data.erro)||'Não salvou. Verifique a internet.');return false}}
 else{const e=EMP.e,tm=EMP.today.slice(0,7),td=+EMP.today.slice(8);S.rec[e.id]=S.rec[e.id]||{};const m=S.rec[e.id][tm]=S.rec[e.id][tm]||{};
  m[td]=Object.assign(m[td]||{},{a:r.a||'',b:r.b||'',c:r.c||'',d:r.d||''});save()}
 return true}

/* ===== botão "Instalar o app" na tela do colaborador ===== */
let INST=null;const INST_KEY='controle-horas-inst-no';
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();INST=ev;const c=document.getElementById('instCard');if(c)instBind()});

 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 return `<div class="card" id="instCard"><h2>Colocar o app na tela do celular</h2>

 <div id="instHow" class="note" style="margin-top:8px">${ios?'<b>iPhone:</b> abra este link no <b>Safari</b>, toque no botão de compartilhar (quadrado com seta) e escolha <b>Adicionar à Tela de Início</b>.':'<b>Chrome:</b> toque nos <b>três pontinhos (⋮)</b> e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b> (se não achar, role o menu).<br><b>Samsung Internet:</b> toque nas <b>três linhas (☰)</b>, depois em <b>Adicionar página a</b> e <b>Tela inicial</b>.'}
 <br>Se nenhuma opção aparecer, tudo bem: você pode abrir sempre este mesmo link no navegador.</div>

function instBind(){const g=document.getElementById('instGo');if(!g)return;
 g.onclick=async()=>{if(INST){try{INST.prompt();await INST.userChoice}catch(e){}INST=null;const c=document.getElementById('instCard');if(c&&jaInstalado())c.remove()}
  else{const h=document.getElementById('instHow');h.style.fontWeight='600';h.scrollIntoView({block:'center',behavior:'smooth'});toast('Siga os passos abaixo do botão')}};

function recCard(){const L=EMP.recibos||[];if(!CLOUD||!L.length)return '';

 return pend.map(box).join('')+hist}

  return `<div class="emp-day"><div><b>${pad(x.d)} ${DN[x.wd]}</b><small>${esc(tx||x.st)}${tx&&x.st?' · '+esc(x.st):''}</small></div><div class="r">${x.w?hm(x.w):''}${x.ext?`<small class="ext">${hm(x.ext)} extra</small>`:''}${vv&&x.vlr!=null?`<small>${brl(x.vlr)}</small>`:''}</div></div>`}).join('')||'<p class="note">Nenhum registro neste mês.</p>'}</div></div>
 <div class="card"><h2>Meu perfil</h2><div class="perfil-foto"><div>${avatarHtml(e)}</div><div><button class="b" id="eFotoBtn">${e.foto?'Trocar minha foto':'Tirar minha selfie'}</button><input type="file" id="eFotoIn" accept="image/*" capture="user" hidden><p class="note" style="margin:6px 0 0">A foto fica só no seu cadastro.</p></div></div>
 <div class="grid">${[['telefone','Telefone / WhatsApp','tel','tel'],['emergNome','Contato de emergência (nome)',null,'text'],['emergTel','Contato de emergência (telefone)','tel','tel'],['cep','CEP','cep','text'],['rua','Rua',null,'text'],['numero','Número',null,'text'],['complemento','Complemento',null,'text'],['bairro','Bairro',null,'text'],['cidade','Cidade',null,'text'],['uf','UF',null,'text']].map(([k,l,m,t])=>`<div><label for="pf-${k}">${l}</label><input id="pf-${k}" type="${t}" data-pk="${k}" ${m?`data-mask="${m}"`:''} ${k==='uf'?'maxlength="2"':''} value="${esc(e[k]||'')}"></div>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="b p" id="pfSave">Salvar meu perfil</button></div><div id="pfMsg"></div></div>
 <div class="card"><h2>Meus dados</h2><table class="r"><tbody>
 <tr><td>Nome</td><td>${esc(e.nome)}</td></tr>${(e.cpfMask||e.cpf)?`<tr><td>CPF</td><td>${esc(e.cpfMask||('***.***.***-'+dig(e.cpf).slice(-2)))}</td></tr>`:''}${e.funcao?`<tr><td>Função</td><td>${esc(e.funcao)}</td></tr>`:''}
 <tr><td>Regime</td><td>${clt?'Carteira assinada (CLT)':'Diarista (horas corridas)'}</td></tr>
 ${vv?(clt?`<tr><td>Salário</td><td>${brl(e.salario)}</td></tr><tr><td>Valor da hora</td><td>${brl(R.hora)}</td></tr>`:`<tr><td>Valor da hora</td><td>${brl(e.valorHora)}</td></tr>`):''}
 <tr><td>Dias liberados</td><td>${ORD.filter(d=>e.dias.includes(d)).map(d=>DN[d]).join(', ')}</td></tr>
 ${clt?`<tr><td>Jornada</td><td>${e.metaSem}h seg–sex${e.dias.includes(6)?' · '+e.metaSab+'h sáb':''}</td></tr>`:''}</tbody></table>
 <p class="note">Algum dado errado? Fale com o responsável. Só ele pode alterar o cadastro e corrigir dias anteriores.</p>
 <div class="row"><button class="b" id="ePriv">Aviso de privacidade</button></div></div>`;
 instBind();
 document.querySelectorAll('[data-rok]').forEach(b=>b.onclick=()=>respRec(b.dataset.rok,'confirmar'));
 document.querySelectorAll('[data-rno]').forEach(b=>b.onclick=()=>$('#rno-'+b.dataset.rno).classList.toggle('hide'));
 document.querySelectorAll('[data-rsend]').forEach(b=>b.onclick=()=>respRec(b.dataset.rsend,'contestar',$('#rob-'+b.dataset.rsend).value));
 $('#mPrev').onclick=async()=>{EMP.ym=ymAdd(EMP.ym,-1);await empFetch();rEmpView()};
 $('#mNext').onclick=async()=>{EMP.ym=ymAdd(EMP.ym,1);await empFetch();rEmpView()};
 const doPunch=async(ext)=>{const btn=$(ext?'#bExt':'#bPunch'),mot=ext?$('#pMot').value.trim():null;
  if(ext&&mot.length<3){EMP.msg='Escreva o motivo do trabalho fora da empresa.';$('#pMsg').textContent=EMP.msg;return}
  btn.disabled=true;$('#pMsg').textContent='Pegando a sua localização…';
  const g=await pegarGps();$('#pMsg').textContent='Registrando…';
  const {data,error}=await sb.rpc('emp_punch',{p_token:EMP.tok,p_lat:g?g.lat:null,p_lon:g?g.lon:null,p_acc:g?g.acc:null,p_device_ts:new Date().toISOString(),p_externo:!!ext,p_motivo:mot});
  if(error||!data)EMP.msg='Não salvou. Verifique a internet e tente de novo.';
  else if(!data.ok)EMP.msg=data.erro;
  else EMP.msg=(data.status==='ok'?`Registrado às ${data.hora}.`:`Registrado às ${data.hora}. Fica aguardando a aprovação do responsável (${(PLACE[data.place]||'').toLowerCase()}).`)+(g?'':' Sem localização: permita o acesso ao local no navegador.');
  await empFetch();rEmpView()};
 $('#ePriv').onclick=()=>abrirPolitica(EMP.empresa);
 $('#eFotoBtn').onclick=()=>$('#eFotoIn').click();
 $('#eFotoIn').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const d=await compressSquare(f);const o={foto:d};document.querySelectorAll('[data-pk]').forEach(i=>o[i.dataset.pk]=i.value.trim());const r=await perfilSalvar(o);if(r.ok){toast('Foto e dados salvos');rEmpView()}else toast(r.erro)}catch(x){toast('Não consegui ler a imagem')}};
 document.querySelectorAll('[data-pk]').forEach(i=>i.addEventListener('input',async()=>{if(i.dataset.mask){const m=MASK[i.dataset.mask](i.value);if(m!==i.value)i.value=m}
  if(i.dataset.pk==='uf')i.value=i.value.toUpperCase();
  if(i.dataset.pk==='cep'&&dig(i.value).length===8){const r=await buscaCep(i.value);if(r)for(const k in r){const x=$('#pf-'+k);if(x)x.value=r[k]}}}));
 $('#pfSave').onclick=async()=>{const o={};document.querySelectorAll('[data-pk]').forEach(i=>o[i.dataset.pk]=i.value.trim());const b=$('#pfSave');b.disabled=true;const r=await perfilSalvar(o);b.disabled=false;
  $('#pfMsg').innerHTML=r.ok?'<p class="info">Perfil salvo.</p>':`<p class="warn">${esc(r.erro)}</p>`};
 if(nuvem){const bp=$('#bPunch');if(bp)bp.onclick=()=>doPunch(false);const be=$('#bExt');if(be)be.onclick=()=>doPunch(true)}
 const st=t=>{EMP.msg=t;const p=$('#pst');if(p)p.textContent=t};
 const commit=async()=>{st('Salvando…');if(await empPunch()){st('Salvo às '+nowHM());await empFetch();const keep=document.activeElement?.id;rEmpView();if(keep&&$('#'+keep))$('#'+keep).focus()}else st('Não salvou. Tente de novo.')};
 if(!nuvem){document.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('change',()=>{EMP.todayRec[i.dataset.p]=i.value;commit()}));
 document.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>{const f=b.dataset.now;EMP.todayRec[f]=nowHM();$('#p-'+f).value=EMP.todayRec[f];commit()})}
}

load();
(async function route(){
 const m=location.hash.match(/^#\/c\/([\w-]+)/);let tok=m?m[1]:null;
 if(!tok&&CLOUD){
  /* endereço simples: quem está entrado como administrador vê o painel; só quem não está usa o acesso guardado do colaborador */
  let adm=false;try{const {data}=await sb.auth.getSession();adm=!!(data&&data.session)}catch(x){}
  if(!adm){try{tok=localStorage.getItem(TOKKEY)}catch(x){}}
 }
 if(tok)empBoot(tok);else adminBoot();
})();
</script>
