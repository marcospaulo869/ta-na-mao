<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Importar da Nuvem</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a08;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 18px 22px;
    border-bottom: 1px solid rgba(243, 229, 171, 0.15);
    background: rgba(18, 18, 15, 0.9);
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 900; letter-spacing: 0.03em;
       color: #d4af37; text-transform: uppercase; }
  .sub { font-size: 10px; letter-spacing: 0.25em; color: #a3a39a;
         font-family: "IBM Plex Mono", ui-monospace, monospace; margin-top: 2px; }
  main { padding: 22px; }
  .actions { display: flex; gap: 8px; margin-bottom: 16px; }
  button {
    background: transparent; border: 1px solid rgba(243, 229, 171, 0.4);
    color: #f3e5ab; padding: 8px 14px; text-transform: uppercase;
    font-size: 11px; letter-spacing: 0.12em; cursor: pointer;
    font-weight: 600; transition: all .18s;
  }
  button:hover { border-color: #d4af37; background: rgba(212, 175, 55, 0.08); color: #fff; }
  button.primary {
    background: linear-gradient(135deg, #f3e5ab, #d4af37);
    color: #0a0a0a; border-color: #f3e5ab; font-weight: 800;
  }
  button.primary:hover { filter: brightness(1.1); }
  .state {
    padding: 14px; border: 1px solid rgba(243, 229, 171, 0.15);
    background: rgba(18, 18, 15, 0.6); font-family: "IBM Plex Mono", monospace;
    font-size: 12px; color: #a3a39a; margin-bottom: 12px; word-break: break-all;
  }
  .err { border-color: rgba(255, 107, 107, 0.4); color: #ff8f8f;
         background: rgba(255, 107, 107, 0.05); }
  .empty { text-align: center; padding: 40px 20px; color: #a3a39a; }
  .empty strong { color: #d4af37; display: block; margin-bottom: 6px; font-size: 14px; }
  .grid { display: grid; gap: 10px; }
  .card {
    border: 1px solid rgba(243, 229, 171, 0.18);
    background: linear-gradient(180deg, rgba(18,18,15,0.9), rgba(10,10,8,0.9));
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    position: relative;
  }
  .card::before, .card::after {
    content: ''; position: absolute; width: 10px; height: 10px;
    border: 1px solid #d4af37; pointer-events: none;
  }
  .card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
  .card .num { font-family: "IBM Plex Mono", monospace; color: #d4af37;
               font-size: 10px; letter-spacing: 0.3em; }
  .card .nome { font-size: 15px; font-weight: 800; text-transform: uppercase;
                letter-spacing: 0.02em; margin-top: 2px; }
  .card .stats { font-family: "IBM Plex Mono", monospace; color: #a3a39a;
                 font-size: 10px; letter-spacing: 0.1em; margin-top: 4px; }
  .footer { margin-top: 20px; text-align: center; color: #a3a39a;
            font-family: "IBM Plex Mono", monospace; font-size: 9px;
            letter-spacing: 0.35em; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Importar da Nuvem</h1>
      <div class="sub">TÁ NA MÃO · MEDIDAS · 3D</div>
    </div>
    <div class="actions">
      <button onclick="sketchup.refresh()">↻ Atualizar</button>
      <button onclick="sketchup.configure()">⚙ URL</button>
    </div>
  </header>
  <main>
    <div id="api-line" class="state">Conectando…</div>
    <div id="content" class="grid"></div>
    <div class="footer">v1.0 · REALIZANDO SONHOS</div>
  </main>

  <script>
    window.tmfSetData = function (data) {
      var api = document.getElementById('api-line');
      var content = document.getElementById('content');
      api.className = 'state' + (data.ok ? '' : ' err');
      api.textContent = (data.ok ? '✓ Conectado a ' : '✗ Erro: ') + (data.error || data.api);

      content.innerHTML = '';
      if (!data.ok) return;

      if (!data.walls || data.walls.length === 0) {
        content.innerHTML = '<div class="empty"><strong>Nenhuma parede na nuvem ainda.</strong>' +
                            'Cadastre paredes no app e clique em Atualizar aqui.</div>';
        return;
      }

      data.walls.forEach(function (w) {
        var aberturas = (w.portas ? w.portas.length : 0) + (w.janelas ? w.janelas.length : 0);
        var inst = ['tomadas','interruptores','saidas_agua','saidas_esgoto','saidas_gas','registros_agua']
                     .reduce(function(s,k){ return s + ((w[k]||[]).length); }, 0);
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div>' +
            '<div class="num">#' + String(w.numero).padStart(2,'0') + '</div>' +
            '<div class="nome">' + w.nome + '</div>' +
            '<div class="stats">' + w.altura_pe_direito + ' × ' + w.largura_total + ' cm · ' +
                aberturas + ' abert · ' + inst + ' instal</div>' +
          '</div>' +
          '<button class="primary" onclick="sketchup.import(\'' + w.id + '\')">Importar</button>';
        content.appendChild(card);
      });
    };
    if (window.sketchup) window.sketchup.ready();
  </script>
</body>
</html>
