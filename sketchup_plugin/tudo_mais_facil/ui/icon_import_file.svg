<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Icon: Importar Parede (arquivo local) — parede + pasta amarela -->
  <defs>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#b8a370"/>
    </linearGradient>
    <linearGradient id="folder1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d49118"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#f7f5ef" stroke="#c99d24" stroke-width="2"/>
  <!-- Wall (main subject) -->
  <g transform="translate(20 30)">
    <polygon points="0,0 70,0 70,50 0,50" fill="url(#wall1)" stroke="#8a6a2a" stroke-width="2" stroke-linejoin="round"/>
    <!-- door -->
    <rect x="10" y="20" width="14" height="30" fill="#5a3a1a" stroke="#2c1a08" stroke-width="1.5"/>
    <circle cx="21" cy="36" r="1.2" fill="#f5c542"/>
    <!-- window -->
    <rect x="42" y="8" width="20" height="16" fill="#a3d5f5" stroke="#2c1a08" stroke-width="1.5"/>
    <line x1="52" y1="8" x2="52" y2="24" stroke="#2c1a08" stroke-width="1"/>
    <line x1="42" y1="16" x2="62" y2="16" stroke="#2c1a08" stroke-width="1"/>
  </g>
  <!-- Folder (bottom right, indicates "from file") -->
  <g transform="translate(70 78)">
    <path d="M0,4 L14,4 L18,0 L46,0 L46,32 L0,32 Z" fill="url(#folder1)" stroke="#a3720d" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="10" x2="46" y2="10" stroke="#a3720d" stroke-width="1"/>
  </g>
  <!-- arrow from folder to wall indicating "load into" -->
  <path d="M78 74 L60 62" stroke="#c99d24" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr1)"/>
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c99d24"/>
    </marker>
  </defs>
</svg>
