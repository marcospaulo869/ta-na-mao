<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Icon: Construtor de Módulos — gabinete grafite com portas, gaveta e ferragens -->
  <defs>
    <linearGradient id="cab2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6470"/>
      <stop offset="100%" stop-color="#2c333c"/>
    </linearGradient>
    <linearGradient id="doorlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#e8ecf1" stroke="#2c333c" stroke-width="2"/>

  <!-- Cabinet body -->
  <g transform="translate(20 16)">
    <rect x="0" y="0" width="88" height="96" fill="url(#cab2)" stroke="#1a1e24" stroke-width="2" stroke-linejoin="round"/>

    <!-- Left door -->
    <rect x="4" y="4" width="36" height="60" fill="url(#cab2)" stroke="#f5c542" stroke-width="1.5"/>
    <rect x="4" y="4" width="36" height="60" fill="url(#doorlight)"/>
    <!-- hinge dots (Ø35 usinagem visual) -->
    <circle cx="8" cy="12" r="2.2" fill="#f5c542"/>
    <circle cx="8" cy="56" r="2.2" fill="#f5c542"/>
    <!-- handle vertical -->
    <rect x="32" y="22" width="3" height="22" fill="#f5c542" rx="1"/>

    <!-- Right door -->
    <rect x="48" y="4" width="36" height="60" fill="url(#cab2)" stroke="#f5c542" stroke-width="1.5"/>
    <rect x="48" y="4" width="36" height="60" fill="url(#doorlight)"/>
    <circle cx="80" cy="12" r="2.2" fill="#f5c542"/>
    <circle cx="80" cy="56" r="2.2" fill="#f5c542"/>
    <rect x="53" y="22" width="3" height="22" fill="#f5c542" rx="1"/>

    <!-- Drawer -->
    <rect x="4" y="68" width="80" height="24" fill="url(#cab2)" stroke="#f5c542" stroke-width="1.5"/>
    <rect x="4" y="68" width="80" height="24" fill="url(#doorlight)"/>
    <!-- drawer handle wide -->
    <rect x="30" y="78" width="28" height="4" fill="#f5c542" rx="1.5"/>
  </g>
</svg>
