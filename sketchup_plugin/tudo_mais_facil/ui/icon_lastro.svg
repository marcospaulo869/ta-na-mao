<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Icon: Lastro de Cozinha — chão de madeira com módulo em cima -->
  <defs>
    <linearGradient id="cabinet1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ede0"/>
      <stop offset="100%" stop-color="#c9b98a"/>
    </linearGradient>
    <linearGradient id="wood1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a76a"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#fef7ea" stroke="#8b5a2b" stroke-width="2"/>

  <!-- Kitchen cabinet on top -->
  <g transform="translate(28 24)">
    <rect x="0" y="0" width="72" height="52" fill="url(#cabinet1)" stroke="#7a5a2a" stroke-width="2" stroke-linejoin="round"/>
    <!-- 2 doors -->
    <line x1="36" y1="4" x2="36" y2="48" stroke="#7a5a2a" stroke-width="1.5"/>
    <!-- handles -->
    <rect x="28" y="26" width="6" height="2" fill="#4a3018"/>
    <rect x="38" y="26" width="6" height="2" fill="#4a3018"/>
  </g>

  <!-- Wooden lastro (THE main subject — thick horizontal wood) -->
  <g transform="translate(20 78)">
    <rect x="0" y="0" width="88" height="18" fill="url(#wood1)" stroke="#5a3a1a" stroke-width="2"/>
    <!-- wood grain -->
    <path d="M4 6 Q22 8 44 6 T84 5" stroke="#5a3a1a" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M4 11 Q22 13 44 11 T84 12" stroke="#5a3a1a" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M4 15 Q22 17 44 15 T84 16" stroke="#5a3a1a" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- knots -->
    <ellipse cx="18" cy="9" rx="2.5" ry="1.5" fill="#5a3a1a" opacity="0.6"/>
    <ellipse cx="62" cy="12" rx="2" ry="1.2" fill="#5a3a1a" opacity="0.5"/>
  </g>

  <!-- Floor line -->
  <line x1="14" y1="102" x2="114" y2="102" stroke="#5a3a1a" stroke-width="1.5" opacity="0.5"/>
</svg>
