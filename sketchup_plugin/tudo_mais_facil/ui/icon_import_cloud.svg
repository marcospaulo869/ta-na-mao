<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Icon: Importar Parede (nuvem) — nuvem azul + parede + seta download -->
  <defs>
    <linearGradient id="cloud1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec4f0"/>
      <stop offset="100%" stop-color="#3b8fd4"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#b8a370"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#eaf4fb" stroke="#3b8fd4" stroke-width="2"/>
  <!-- Cloud at top -->
  <g transform="translate(20 12)">
    <path d="M25,30 C10,30 8,14 22,10 C24,-2 44,-2 48,8 C64,4 72,20 60,30 Z"
          fill="url(#cloud1)" stroke="#1d5a94" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- Download arrow -->
  <path d="M64 48 L64 76" stroke="#1d5a94" stroke-width="5" stroke-linecap="round"/>
  <polygon points="52,68 64,84 76,68" fill="#1d5a94"/>
  <!-- Wall at bottom -->
  <g transform="translate(30 90)">
    <polygon points="0,0 68,0 68,26 0,26" fill="url(#wall2)" stroke="#8a6a2a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="10" y="8" width="12" height="18" fill="#5a3a1a" stroke="#2c1a08" stroke-width="1"/>
    <rect x="40" y="4" width="18" height="10" fill="#a3d5f5" stroke="#2c1a08" stroke-width="1"/>
  </g>
</svg>
