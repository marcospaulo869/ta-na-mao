<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tá Na Mão">
  <defs>
    <!-- Gold gradient (metal, warm to cool) -->
    <linearGradient id="tnm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ebc0"/>
      <stop offset="35%" stop-color="#f3e5ab"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a5a10"/>
    </linearGradient>
    <radialGradient id="tnm-tap" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="40%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#a97b1e"/>
    </radialGradient>
    <radialGradient id="tnm-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(212,175,55,0.35)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
    <filter id="tnm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square base (app-icon shape) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0a0a08"/>

  <!-- Ambient gold aura behind the mark -->
  <circle cx="256" cy="256" r="220" fill="url(#tnm-aura)"/>

  <!-- Faint corner marks (industrial precision feel) -->
  <g stroke="#d4af37" stroke-width="3" fill="none" opacity="0.55">
    <path d="M 46 92 L 46 46 L 92 46"/>
    <path d="M 420 46 L 466 46 L 466 92"/>
    <path d="M 466 420 L 466 466 L 420 466"/>
    <path d="M 92 466 L 46 466 L 46 420"/>
  </g>

  <!-- 3 concentric ripples radiating from the tap point -->
  <g stroke="url(#tnm-gold)" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="184" stroke-width="2" opacity="0.28"/>
    <circle cx="256" cy="256" r="146" stroke-width="2.3" opacity="0.45"/>
    <circle cx="256" cy="256" r="110" stroke-width="2.6" opacity="0.7"/>
  </g>

  <!-- Central "tap" — a golden fingertip dot -->
  <circle cx="256" cy="256" r="78" fill="url(#tnm-tap)" filter="url(#tnm-glow)"/>

  <!-- Bold "T" (for Tá) inside the tap circle -->
  <g fill="#0a0a08">
    <!-- Horizontal bar -->
    <rect x="216" y="216" width="80" height="14" rx="3"/>
    <!-- Vertical stem -->
    <rect x="249" y="216" width="14" height="80" rx="3"/>
  </g>

  <!-- Tiny "check" flourish on top-right of the ripple set — signals "ready / done" -->
  <path d="M 360 152 L 380 172 L 416 132" stroke="url(#tnm-gold)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
