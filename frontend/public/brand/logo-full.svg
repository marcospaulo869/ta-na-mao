<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Tá Na Mão">
  <defs>
    <linearGradient id="tnm-w-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ebc0"/>
      <stop offset="45%" stop-color="#f3e5ab"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a5a10"/>
    </linearGradient>
    <radialGradient id="tnm-w-tap" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="40%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#a97b1e"/>
    </radialGradient>
  </defs>

  <!-- Mark (left) -->
  <g transform="translate(0 0)">
    <rect x="10" y="10" width="240" height="240" rx="46" fill="#0a0a08" stroke="url(#tnm-w-gold)" stroke-width="2"/>
    <!-- ripples -->
    <g stroke="url(#tnm-w-gold)" fill="none" stroke-linecap="round" transform="translate(130 130)">
      <circle cx="0" cy="0" r="86" stroke-width="1.6" opacity="0.28"/>
      <circle cx="0" cy="0" r="68" stroke-width="1.8" opacity="0.45"/>
      <circle cx="0" cy="0" r="52" stroke-width="2" opacity="0.7"/>
    </g>
    <!-- tap -->
    <circle cx="130" cy="130" r="38" fill="url(#tnm-w-tap)"/>
    <!-- T inside -->
    <g fill="#0a0a08">
      <rect x="110" y="110" width="40" height="8" rx="2"/>
      <rect x="126" y="110" width="8" height="42" rx="2"/>
    </g>
  </g>

  <!-- Wordmark (right) -->
  <g transform="translate(288 0)" font-family="'Outfit', 'Inter', sans-serif" font-weight="900">
    <text x="0" y="130" font-size="88" fill="url(#tnm-w-gold)" letter-spacing="0.02em">TÁ NA MÃO</text>
    <text x="4" y="180" font-size="20" fill="#a3a39a" letter-spacing="0.5em" font-weight="400">MEDIDAS · 3D · MARCENARIA</text>
    <!-- Gold underline accent -->
    <rect x="4" y="200" width="80" height="3" fill="url(#tnm-w-gold)"/>
    <text x="94" y="205" font-size="12" fill="#d4af37" letter-spacing="0.35em" font-weight="400" font-family="'IBM Plex Mono', monospace">EM UM TOQUE</text>
  </g>
</svg>
